<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chord Draft Diagram Make by Ray Foo</title>
    <script>
      (function () {
        try {
          var v = localStorage.getItem('chorddraft-theme-level');
          var lvl = v === null ? 50 : Number(v);
          if (!isNaN(lvl) && lvl < 50) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Interactive SVG guitar chord diagram maker with real-time chord detection, chord library lookup, acoustic audio preview, and PNG, SVG, and Vanilla JS embed export for music educators and learners."
    />
    <meta property="og:title" content="Chord Draft Diagram Make by Ray Foo" />
    <meta
      property="og:description"
      content="Create, detect, audition, and export publication-grade SVG guitar chord diagrams and embeddable Vanilla JS widgets."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-sky-100 selection:text-sky-900 dark:selection:bg-sky-900 dark:selection:text-sky-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
